apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jev-webhook
  template:
    metadata:
      labels:
        app: jev-webhook
    spec:
      containers:
      - name: webhook
        image: python:3.9-slim
        command:
        - bash
        - -c
        - |
          pip install flask
          python -c "
          from flask import Flask, request, jsonify
          app = Flask(__name__)
          
          @app.route('/guardrail/jev', methods=['POST'])
          def evaluate_prompt():
              payload = request.json or {}
              prompt_text = str(payload)
              
              if 'Ignore' in prompt_text or 'system prompt' in prompt_text:
                  print('Detected attack, returning deny.')
                  return jsonify({
                      'action': 'deny',
                      'reason': 'Rejected by JEV: jailbreak, secrets'
                  }), 403
                  
              print('Prompt safe, returning allow.')
              return jsonify({'action': 'allow'}), 200

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)
          "
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: jev-webhook
spec:
  selector:
    app: jev-webhook
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
